<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f8fb"/>
      <stop offset="100%" stop-color="#e9eef8"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dff5ff"/>
      <stop offset="100%" stop-color="#b9e5ff"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4f7df"/>
      <stop offset="100%" stop-color="#c8edc1"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0d6"/>
      <stop offset="100%" stop-color="#ffdca3"/>
    </linearGradient>
    <linearGradient id="external" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2e7ff"/>
      <stop offset="100%" stop-color="#dac8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif;
        fill: #172033;
      }
      .title { font-size: 46px; font-weight: 800; }
      .subtitle { font-size: 24px; fill: #526173; }
      .section-title { font-size: 28px; font-weight: 800; }
      .body { font-size: 22px; fill: #26364a; }
      .small { font-size: 18px; fill: #526173; }
      .tiny { font-size: 16px; fill: #64748b; }
      .label { font-size: 18px; font-weight: 700; fill: #334155; }
      .box { rx: 26; filter: url(#shadow); stroke-width: 2; }
      .inner { rx: 18; stroke-width: 1.5; }
      .arrow { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 10 10; }
      .pill { rx: 18; }
      .code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 18px; fill: #334155; }
    </style>
  </defs>

  <rect width="1800" height="1250" fill="url(#bg)"/>

  <text x="900" y="70" text-anchor="middle" class="title">HelloAgents Trip Planner 全栈架构图</text>
  <text x="900" y="112" text-anchor="middle" class="subtitle">从浏览器表单，到 FastAPI 后端，再到多 Agent、LLM 和外部工具</text>

  <!-- User -->
  <rect x="705" y="155" width="390" height="105" class="box" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="900" y="197" text-anchor="middle" class="section-title">用户</text>
  <text x="900" y="231" text-anchor="middle" class="body">在浏览器填写旅行需求</text>

  <path d="M 900 260 L 900 325" class="arrow"/>
  <text x="935" y="300" class="label">输入城市 / 日期 / 偏好</text>

  <!-- Frontend -->
  <rect x="120" y="330" width="1560" height="235" class="box" fill="url(#front)" stroke="#7dd3fc"/>
  <text x="170" y="380" class="section-title">前端 Frontend</text>
  <text x="170" y="414" class="body">Vue 3 + TypeScript + Vite：负责页面、表单、用户交互和结果展示</text>

  <rect x="170" y="450" width="410" height="78" class="inner" fill="#ffffff" stroke="#8bd3f7"/>
  <text x="205" y="482" class="body">Home.vue</text>
  <text x="205" y="510" class="small">收集旅行需求，提交表单</text>

  <rect x="695" y="450" width="410" height="78" class="inner" fill="#ffffff" stroke="#8bd3f7"/>
  <text x="730" y="482" class="body">api.ts / Axios</text>
  <text x="730" y="510" class="small">把表单 JSON 发给后端 API</text>

  <rect x="1220" y="450" width="410" height="78" class="inner" fill="#ffffff" stroke="#8bd3f7"/>
  <text x="1255" y="482" class="body">Result.vue</text>
  <text x="1255" y="510" class="small">展示行程、预算、天气、地图</text>

  <path d="M 580 489 L 695 489" class="arrow"/>
  <path d="M 1105 489 L 1220 489" class="arrow dash"/>
  <text x="755" y="548" class="code">POST /api/trip/plan</text>

  <path d="M 900 565 L 900 635" class="arrow"/>
  <text x="935" y="609" class="label">HTTP 请求 / JSON 数据</text>

  <!-- Backend -->
  <rect x="120" y="640" width="1560" height="245" class="box" fill="url(#back)" stroke="#86efac"/>
  <text x="170" y="690" class="section-title">后端 Backend</text>
  <text x="170" y="724" class="body">FastAPI：负责接收请求、校验数据、保护密钥、组织业务流程</text>

  <rect x="170" y="760" width="360" height="82" class="inner" fill="#ffffff" stroke="#8cdd91"/>
  <text x="205" y="793" class="body">main.py</text>
  <text x="205" y="821" class="small">启动服务，注册路由，配置 CORS</text>

  <rect x="600" y="760" width="360" height="82" class="inner" fill="#ffffff" stroke="#8cdd91"/>
  <text x="635" y="793" class="body">trip.py</text>
  <text x="635" y="821" class="small">接收 /api/trip/plan 请求</text>

  <rect x="1030" y="760" width="280" height="82" class="inner" fill="#ffffff" stroke="#8cdd91"/>
  <text x="1065" y="793" class="body">schemas.py</text>
  <text x="1065" y="821" class="small">定义请求和响应结构</text>

  <rect x="1370" y="760" width="260" height="82" class="inner" fill="#ffffff" stroke="#8cdd91"/>
  <text x="1405" y="793" class="body">config.py</text>
  <text x="1405" y="821" class="small">读取 API Key 和环境变量</text>

  <path d="M 530 801 L 600 801" class="arrow"/>
  <path d="M 960 801 L 1030 801" class="arrow dash"/>
  <path d="M 1310 801 L 1370 801" class="arrow dash"/>

  <path d="M 900 885 L 900 950" class="arrow"/>
  <text x="935" y="925" class="label">Python 函数调用</text>

  <!-- Agent -->
  <rect x="120" y="955" width="985" height="225" class="box" fill="url(#agent)" stroke="#fbbf24"/>
  <text x="170" y="1005" class="section-title">Agent 业务层</text>
  <text x="170" y="1039" class="body">HelloAgents + SimpleAgent：理解需求、调用工具、整合结果</text>

  <rect x="170" y="1070" width="210" height="70" class="inner" fill="#ffffff" stroke="#f7c65b"/>
  <text x="275" y="1100" text-anchor="middle" class="body">景点搜索</text>
  <text x="275" y="1127" text-anchor="middle" class="small">Attraction Agent</text>

  <rect x="415" y="1070" width="210" height="70" class="inner" fill="#ffffff" stroke="#f7c65b"/>
  <text x="520" y="1100" text-anchor="middle" class="body">天气查询</text>
  <text x="520" y="1127" text-anchor="middle" class="small">Weather Agent</text>

  <rect x="660" y="1070" width="210" height="70" class="inner" fill="#ffffff" stroke="#f7c65b"/>
  <text x="765" y="1100" text-anchor="middle" class="body">酒店推荐</text>
  <text x="765" y="1127" text-anchor="middle" class="small">Hotel Agent</text>

  <rect x="895" y="1070" width="170" height="70" class="inner" fill="#ffffff" stroke="#f7c65b"/>
  <text x="980" y="1100" text-anchor="middle" class="body">行程规划</text>
  <text x="980" y="1127" text-anchor="middle" class="small">Planner</text>

  <path d="M 380 1105 L 415 1105" class="arrow"/>
  <path d="M 625 1105 L 660 1105" class="arrow"/>
  <path d="M 870 1105 L 895 1105" class="arrow"/>

  <!-- External -->
  <rect x="1185" y="955" width="495" height="225" class="box" fill="url(#external)" stroke="#c4b5fd"/>
  <text x="1235" y="1005" class="section-title">外部能力</text>
  <text x="1235" y="1039" class="body">LLM 和第三方 API 提供真实能力</text>

  <rect x="1235" y="1070" width="190" height="70" class="inner" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1330" y="1100" text-anchor="middle" class="body">LLM 模型</text>
  <text x="1330" y="1127" text-anchor="middle" class="small">推理 / 生成 / 整合</text>

  <rect x="1460" y="1070" width="170" height="70" class="inner" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1545" y="1100" text-anchor="middle" class="body">工具 API</text>
  <text x="1545" y="1127" text-anchor="middle" class="small">高德地图 / 图片</text>

  <path d="M 1105 1065 C 1160 1010, 1205 1055, 1235 1092" class="arrow"/>
  <path d="M 1105 1115 C 1170 1160, 1410 1165, 1460 1120" class="arrow"/>

  <!-- Return flow -->
  <path d="M 980 1070 C 1060 930, 1010 905, 900 885" class="arrow dash"/>
  <text x="1008" y="940" class="label">生成 TripPlan JSON</text>

  <path d="M 610 1180 C 445 1215, 255 1150, 250 1035 C 240 815, 655 900, 700 645 C 725 505, 820 565, 900 565" class="arrow dash"/>
  <text x="275" y="1210" class="label">返回结果给前端，渲染页面</text>

  <!-- Bottom legend -->
  <rect x="120" y="1195" width="1560" height="1" fill="#cbd5e1"/>
  <text x="120" y="1230" class="tiny">学习口诀：前端管界面，后端管业务和密钥，Agent 管智能规划，外部 API 管真实世界数据。</text>
</svg>
